name: Deploy to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'app-cc/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_DEPLOY_BUCKET: crazy-clothes-deploy-660759882203
  ASG_NAME: crazy-clothes-web-asg

permissions:
  id-token: write   # Required for OIDC authentication
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app-cc/package-lock.json'

      - name: Install dependencies
        working-directory: ./app-cc
        run: npm ci

      - name: Build Next.js app
        working-directory: ./app-cc
        run: npm run build
        env:
          # Build-time env vars (database NOT accessed during build
          # because all pages use export const dynamic = 'force-dynamic')
          NODE_ENV: production

      - name: Create build artifact
        working-directory: ./app-cc
        run: tar -czf next-build.tar.gz .next

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::660759882203:role/crazy-clothes-github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build artifact to S3
        working-directory: ./app-cc
        run: |
          aws s3 cp next-build.tar.gz s3://${{ env.S3_DEPLOY_BUCKET }}/next-build.tar.gz
          echo "Build artifact uploaded to S3"

      - name: Deploy to ASG instances via SSM
        run: |
          # Get instance IDs from ASG
          INSTANCE_IDS=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names ${{ env.ASG_NAME }} \
            --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`].InstanceId' \
            --output text)

          if [ -z "$INSTANCE_IDS" ]; then
            echo "ERROR: No instances found in ASG ${{ env.ASG_NAME }}"
            exit 1
          fi

          echo "Deploying to instances: $INSTANCE_IDS"

          # Send deploy command via SSM to all instances
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids $INSTANCE_IDS \
            --parameters 'commands=[
              "set -e",
              "cd /opt/crazy-clothes",
              "echo Downloading new build...",
              "aws s3 cp s3://${{ env.S3_DEPLOY_BUCKET }}/next-build.tar.gz /tmp/next-build.tar.gz",
              "echo Extracting build...",
              "rm -rf .next",
              "tar -xzf /tmp/next-build.tar.gz",
              "echo Restarting PM2...",
              "pm2 restart crazy-clothes || pm2 start npm --name crazy-clothes -- start",
              "echo Deploy complete"
            ]' \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for command to complete
          echo "Waiting for deploy to complete..."
          for instance in $INSTANCE_IDS; do
            aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$instance"

            # Get command output
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$instance" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output text
          done

          echo "Deploy completed successfully"

      - name: Summary
        run: |
          echo "✅ Build and deploy completed successfully"
          echo "📦 Artifact: s3://${{ env.S3_DEPLOY_BUCKET }}/next-build.tar.gz"
          echo "🚀 Deployed to ASG: ${{ env.ASG_NAME }}"
